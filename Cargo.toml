[workspace]
resolver = "3"
members = [
  "apps/desktop/src-tauri",
  "crates/meiki-application",
  "crates/meiki-domain",
  "crates/meiki-media",
  "crates/meiki-portable",
  "crates/meiki-scheduler",
  "crates/meiki-storage",
  "crates/meiki-text",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/25d-228/meiki"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
hex = "0.4"
infer = "0.19"
rusqlite = { version = "0.37", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = "2"
tauri-build = "2"
tempfile = "3"
thiserror = "2"
ts-rs = { version = "11", features = ["serde-compat"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"
unicode-general-category = "1.1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
