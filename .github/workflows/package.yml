name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux
            bundles: deb,rpm,appimage
          - os: macos-14
            name: macos
            bundles: app,dmg
          - os: windows-2025
            name: windows
            bundles: nsis,msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Install Linux desktop dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            at-spi2-core \
            dbus-x11 \
            libappindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            xvfb
      - name: Install locked dependencies
        run: npm ci
      - name: Validate release inputs
        run: |
          npm run release:check
          npm run bindings
          npm run typecheck
          cargo test --workspace
      - name: Build platform bundles
        run: npm run tauri --workspace @meiki/desktop -- build --bundles ${{ matrix.bundles }}
      - name: Smoke launch Linux package
        if: matrix.name == 'linux'
        run: dbus-run-session -- xvfb-run --auto-servernum python scripts/package-launch-smoke.py
      - name: Smoke launch desktop package
        if: matrix.name != 'linux'
        run: python scripts/package-launch-smoke.py --timeout 30
      - name: Upload package smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: meiki-${{ matrix.name }}-smoke-failure
          path: target/release/bundle
          if-no-files-found: ignore
      - name: Write artifact checksums
        run: python scripts/hash-artifacts.py
      - uses: actions/upload-artifact@v4
        with:
          name: meiki-${{ matrix.name }}
          path: target/release/bundle
          if-no-files-found: error
      - name: Attest tagged release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: target/release/bundle/**
